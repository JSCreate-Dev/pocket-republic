name: Simulator screenshots

# Capture-only. This does not replace Build iOS IPA and does not run on main.
# Apple's documented capture is `xcrun simctl io booted screenshot`.
# The hosted xcode-27 image is required: this app calls iOS 27.1 APIs.

on:
  push:
    branches:
      - cursor/sim-screenshots-49ee

permissions:
  contents: read

jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          set -euo pipefail
          xcode_app=/Applications/Xcode_27.1.app
          if [[ ! -d "$xcode_app/Contents/Developer" ]]; then
            echo "Xcode 27.1 is not installed on this runner image."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$xcode_app"
          xcodebuild -version

      - name: Build simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -project PocketRepublic.xcodeproj \
            -scheme PocketRepublic \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim-dd" \
            CODE_SIGNING_ALLOWED=NO \
            TARGETED_DEVICE_FAMILY="1,2" \
            INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad="UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight" \
            build

      - name: Boot simulator and capture screenshots
        run: bash .github/scripts/capture-simulator-screenshots.sh "$GITHUB_WORKSPACE/simulator-screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: simulator-screenshots/
          if-no-files-found: warn
          retention-days: 14
